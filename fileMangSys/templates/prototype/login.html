{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Enterprise Document Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-page);
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-brand">
        <div class="brand-logo-icon" style="width: 36px; height: 36px; font-size: 18px;">D</div>
        <div>
          <h1 style="font-size: 18px; font-weight: 600;">Enterprise DMS</h1>
          <p style="font-size: 12px; color: var(--text-secondary);">Centralized Department File System</p>
        </div>
      </div>

      {% if messages %}
        <div style="margin-bottom: 16px;">
          {% for message in messages %}
            <div style="padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 8px; {% if message.tags == 'error' %}background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5;{% else %}background: #DEF7EC; color: #03543F; border: 1px solid #BCF0DA;{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form action="{% url 'login_page' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label required">Corporate Email</label>
          <input type="email" name="email" class="form-control" value="{{ request.POST.email|default:'' }}" required placeholder="name@enterprise.local" autofocus>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <label class="form-label required" style="margin-bottom: 0;">Password</label>
            <span style="font-size: 11px; color: var(--text-secondary);">Enterprise DMS</span>
          </div>
          <input type="password" name="password" class="form-control" value="" required placeholder="Enter account password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px;">Sign In to Workspace</button>
      </form>
    </div>
  </div>
</body>
</html>
