{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Enterprise Document Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-page);
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .login-quick-roles {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .role-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .role-pill-btn {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      color: var(--text-primary);
      text-align: center;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .role-pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-brand">
        <div class="brand-logo-icon" style="width: 36px; height: 36px; font-size: 18px;">D</div>
        <div>
          <h1 style="font-size: 18px; font-weight: 600;">Enterprise DMS</h1>
          <p style="font-size: 12px; color: var(--text-secondary);">Centralized Department File System</p>
        </div>
      </div>

      <form action="{% url 'dashboard_super_admin' %}" method="get">
        <div class="form-group">
          <label class="form-label required">Corporate Email</label>
          <input type="email" class="form-control" value="" required placeholder="name@enterprise.local">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <label class="form-label required" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 11px; color: var(--text-secondary);">Forgot?</a>
          </div>
          <input type="password" class="form-control" value="" required placeholder="Enter account password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px;">Sign In to Workspace</button>
      </form>

      <!-- Clean prototype role launcher without clutter -->
      <div class="login-quick-roles">
        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary);">Preview As Role</div>
        <div class="role-pills">
          <a href="{% url 'dashboard_super_admin' %}" class="role-pill-btn">Super Admin</a>
          <a href="{% url 'dashboard_admin' %}" class="role-pill-btn">Administrator</a>
          <a href="{% url 'dashboard_manager' %}" class="role-pill-btn">Manager</a>
          <a href="{% url 'dashboard_employee' %}" class="role-pill-btn">Employee</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
